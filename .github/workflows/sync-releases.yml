name: Sync Releases from Upstream

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点（北京时间 8 点）自动检查
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    name: Sync Releases

    steps:
      - name: Clone Releases
        uses: andrewthetechie/gha-clone-releases@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          src_repo: faisalkindi/DLSS5oneclick
          dest_repo: jvc2025/DLSS5oneclick
          copy_assets: true
          skip_draft: true
          skip_prerelease: true
